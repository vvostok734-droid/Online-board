<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учебная Доска</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <!-- Подключаем PeerJS для видео и звуковой связи WebRTC -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    /* Стили плавающего видео-блока */
    #video-conference-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 280px;
      height: 240px;
      background: #181825;
      border: 2px solid #45475a;
      border-radius: 12px;
      overflow: hidden;
      z-index: 1000;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .video-header {
      background: #313244;
      color: #cdd6f4;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      cursor: grab;
      border-bottom: 1px solid #45475a;
    }

    .video-header:active {
      cursor: grabbing;
    }

    .video-viewport {
      position: relative;
      flex: 1;
      background: #11111b;
      overflow: hidden;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #localVideo {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #89b4fa;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      background: #000;
    }

    .video-controls {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px;
      background: #1e1e2e;
      border-top: 1px solid #313244;
    }

    .video-controls button {
      background: #313244;
      color: #cdd6f4;
      border: 1px solid #45475a;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .video-controls button:hover {
      background: #45475a;
    }

    .video-controls button.btn-off {
      background: #f38ba8;
      color: #11111b;
      font-weight: bold;
    }

    /* Подсказка при отсутствии связи */
    .video-placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #a6adc8;
      font-size: 12px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ВХОД -->
  <div id="auth-overlay">
    <div class="auth-box">
      <h2>🎓 Вход на урок</h2>
      <p>Введите ваш PIN-код доступа:</p>
      <input type="password" id="authPinInput" placeholder="••••" onkeydown="if(event.key==='Enter') loginWithPin()">
      <button type="button" onclick="loginWithPin()">Войти</button>
      <div id="authError"></div>
    </div>
  </div>

  <!-- МОДАЛКА ТЕКСТА -->
  <div id="text-modal" style="display:none;">
    <div class="modal-box">
      <h3 style="color:#cba6f7; margin-bottom:10px;">📄 Текст на доску</h3>
      <textarea id="bigTextInput" rows="4" placeholder="Введите ваш текст..." style="width:100%; padding:10px; border-radius:6px; background:#181825; color:#cdd6f4; border:1px solid #45475a; resize:none; margin-bottom:12px; font-size:16px;"></textarea>
      <div style="display:flex; gap:10px;">
        <button type="button" onclick="confirmBigText()" style="flex:1; padding:10px; background:#a6e3a1; color:#11111b; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Добавить</button>
        <button type="button" onclick="closeBigTextModal()" style="flex:1; padding:10px; background:#f38ba8; color:#11111b; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- МОДАЛКА УПРАВЛЕНИЯ УЧЕНИКАМИ (ПАНЕЛЬ УЧИТЕЛЯ) -->
  <div id="admin-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999; justify-content:center; align-items:center;">
    <div class="modal-box" style="background:#1e1e2e; color:#cdd6f4; padding:20px; border-radius:12px; width:90%; max-width:550px; max-height:85vh; overflow-y:auto; border:1px solid #45475a;">
      <h3 style="color:#b4befe; margin-bottom:15px; text-align:center;">👥 Управление учениками</h3>
      
      <!-- Форма добавления до 5 учеников -->
      <div style="background:#181825; padding:12px; border-radius:8px; margin-bottom:15px; border:1px solid #313244;">
        <h4 style="color:#a6e3a1; margin-bottom:10px;">➕ Добавить учеников (до 5 одновременно)</h4>
        <div id="addStudentsContainer">
          <div class="student-input-row" style="display:flex; gap:8px; margin-bottom:6px;">
            <input type="text" class="new-st-name" placeholder="Имя ученика 1" style="flex:1; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
            <input type="text" class="new-st-pin" placeholder="PIN / Пароль" style="width:110px; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
          </div>
          <div class="student-input-row" style="display:flex; gap:8px; margin-bottom:6px;">
            <input type="text" class="new-st-name" placeholder="Имя ученика 2" style="flex:1; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
            <input type="text" class="new-st-pin" placeholder="PIN / Пароль" style="width:110px; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
          </div>
          <div class="student-input-row" style="display:flex; gap:8px; margin-bottom:6px;">
            <input type="text" class="new-st-name" placeholder="Имя ученика 3" style="flex:1; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
            <input type="text" class="new-st-pin" placeholder="PIN / Пароль" style="width:110px; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
          </div>
          <div class="student-input-row" style="display:flex; gap:8px; margin-bottom:6px;">
            <input type="text" class="new-st-name" placeholder="Имя ученика 4" style="flex:1; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
            <input type="text" class="new-st-pin" placeholder="PIN / Пароль" style="width:110px; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
          </div>
          <div class="student-input-row" style="display:flex; gap:8px; margin-bottom:6px;">
            <input type="text" class="new-st-name" placeholder="Имя ученика 5" style="flex:1; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
            <input type="text" class="new-st-pin" placeholder="PIN / Пароль" style="width:110px; padding:6px 10px; border-radius:4px; background:#313244; color:#fff; border:none;">
          </div>
        </div>
        <button type="button" onclick="saveBatchStudents()" style="width:100%; margin-top:8px; padding:8px; background:#a6e3a1; color:#11111b; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Сохранить новых учеников</button>
      </div>

      <!-- Список существующих учеников -->
      <h4 style="color:#89b4fa; margin-bottom:8px;">📋 Список учеников</h4>
      <div id="adminStudentsList" style="max-height:200px; overflow-y:auto; margin-bottom:15px;">
        <!-- Динамически заполняется через JS -->
      </div>

      <button type="button" onclick="closeAdminModal()" style="width:100%; padding:10px; background:#f38ba8; color:#11111b; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Закрыть</button>
    </div>
  </div>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <div id="top-bar">
    <div class="top-section">
      <button type="button" onclick="setPen()">✏️ Кисть</button>
      <button type="button" onclick="setEraser()">🧹 Стерка</button>
      <input type="color" id="colorPicker" value="#000000">
      <input type="range" id="lineWidth" min="1" max="20" value="4">
    </div>

    <div class="top-section">
      <label for="boardImageInput" style="background:#89b4fa; color:#11111b; padding:6px 12px; border-radius:6px; font-size:14px; cursor:pointer; font-weight:bold;">🖼 Картинка</label>
      <input type="file" id="boardImageInput" accept="image/*" style="display:none;" onchange="handleBoardImageUpload(event)">
    </div>

    <div class="top-section">
      <button type="button" onclick="showBigTextModal()" style="background:#cba6f7; color:#11111b; font-weight:bold;">📄 Написать текст</button>
    </div>

    <!-- Кнопка видна только учителю -->
    <div class="top-section" id="teacherSection" style="display:none;">
      <button type="button" onclick="showAdminModal()" style="background:#b4befe; color:#11111b; font-weight:bold;">👥 Панель учеников</button>
    </div>

    <div class="top-section">
      <button type="button" onclick="clearCanvas()" style="background:#f38ba8; color:#11111b;">🗑 Очистить</button>
      <button type="button" onclick="logout()" style="background:#45475a; color:#cdd6f4; margin-left:5px;">Выход</button>
    </div>
  </div>

  <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
  <div id="main-container">
    <div id="canvas-container">
      <div id="board-word-list"></div>
      <canvas id="paintBoard"></canvas>
    </div>

    <!-- ЧАТ С ПРЯМЫМИ ОБРАБОТЧИКАМИ -->
    <div id="side-panel">
      <div class="side-column">
        <h4 id="panelTitle">Чат урока</h4>
        <div id="chatMessages"></div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendChatMessage()">
          
          <label for="chatFileInput" class="chat-attach-btn" title="Прикрепить файл">📎</label>
          <input type="file" id="chatFileInput" onchange="handleChatFileUpload(event)">
          
          <button type="button" class="chat-send-btn" onclick="sendChatMessage()">Отправить</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ПЛАВАЮЩИЙ БЛОК ВИДЕОСВЯЗИ (Учитель + Ученик) -->
  <div id="video-conference-box">
    <div class="video-header" id="videoHeader">🎥 Видеосвязь (тяни заголовок)</div>
    <div class="video-viewport">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="video-placeholder" id="videoPlaceholder">Ожидание подключения...</div>
    </div>
    
    <div class="video-controls">
      <button type="button" id="toggleAudioBtn" onclick="toggleAudio()">🎙️ Вкл. звук</button>
      <button type="button" id="toggleVideoBtn" onclick="toggleVideo()">📷 Вкл. видео</button>
      <button type="button" id="callUserBtn" onclick="startCall()" style="background:#a6e3a1; color:#11111b; font-weight:bold;">📞 Вызов</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
