<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Учебная Доска</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- ВХОД -->
  <div id="auth-overlay">
    <div class="auth-box">
      <h2>🎓 Вход на урок</h2>
      <p>Введите ваш PIN-код доступа:</p>
      <input type="password" id="authPinInput" placeholder="••••">
      <button type="button" onclick="loginWithPin()">Войти</button>
      <div id="authError"></div>
    </div>
  </div>

  <!-- МОДАЛКА ТЕКСТА -->
  <div id="text-modal" style="display:none;">
    <div class="modal-box">
      <h3 style="color:#cba6f7; margin-bottom:10px;">📄 Текст на доску</h3>
      <textarea id="bigTextInput" rows="4" placeholder="Введите ваш текст..." style="width:100%; padding:10px; border-radius:6px; background:#181825; color:#cdd6f4; border:1px solid #45475a; resize:none; margin-bottom:12px; font-size:16px;"></textarea>
      <div style="display:flex; gap:10px;">
        <button type="button" onclick="confirmBigText()" style="flex:1; padding:10px; background:#a6e3a1; color:#11111b; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Добавить</button>
        <button type="button" onclick="closeBigTextModal()" style="flex:1; padding:10px; background:#f38ba8; color:#11111b; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Отмена</button>
      </div>
    </div>
  </div>

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <div id="top-bar">
    <div class="top-section">
      <button type="button" onclick="setPen()">✏️ Кисть</button>
      <button type="button" onclick="setEraser()">🧹 Стерка</button>
      <input type="color" id="colorPicker" value="#000000">
      <input type="range" id="lineWidth" min="1" max="20" value="4">
    </div>

    <div class="top-section">
      <label for="boardImageInput" style="background:#89b4fa; color:#11111b; padding:6px 12px; border-radius:6px; font-size:14px; cursor:pointer; font-weight:bold;">🖼 Картинка</label>
      <input type="file" id="boardImageInput" accept="image/*" style="display:none;" onchange="handleBoardImageUpload(event)">
    </div>

    <div class="top-section">
      <button type="button" onclick="showBigTextModal()" style="background:#cba6f7; color:#11111b; font-weight:bold;">📄 Написать текст</button>
    </div>

    <div class="top-section" id="teacherSection" style="display:none;">
      <button type="button" onclick="showAdminModal()" style="background:#b4befe; color:#11111b; font-weight:bold;">👑 Пароли учеников</button>
    </div>

    <div class="top-section">
      <button type="button" onclick="clearCanvas()" style="background:#f38ba8; color:#11111b;">🗑 Очистить</button>
      <button type="button" onclick="logout()" style="background:#45475a; color:#cdd6f4; margin-left:5px;">Выход</button>
    </div>
  </div>

  <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
  <div id="main-container">
    <div id="canvas-container">
      <div id="board-word-list"></div>
      <canvas id="paintBoard"></canvas>
    </div>

    <!-- ЧАТ С ПРЯМЫМИ ОБРАБОТЧИКАМИ -->
    <div id="side-panel">
      <div class="side-column">
        <h4 id="panelTitle">Чат урока</h4>
        <div id="chatMessages"></div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendChatMessage()">
          
          <label for="chatFileInput" class="chat-attach-btn" title="Прикрепить файл">📎</label>
          <input type="file" id="chatFileInput" onchange="handleChatFileUpload(event)">
          
          <button type="button" class="chat-send-btn" onclick="sendChatMessage()">Отправить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
